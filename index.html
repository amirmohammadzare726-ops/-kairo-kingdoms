<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d12" />
    <title>کایرو کینگدامز</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">کایرو <span>کینگدامز</span></div>
        <div class="status">جهان آذر <i></i> آنلاین</div>
      </header>
      <main>
        <section class="scene-wrap">
          <div class="scene-heading">
            <p>جهان پهناور در انتظار توست</p>
            <h1>قلمرو خود را بساز</h1>
          </div>
          <div id="world-scene" aria-label="نمای سه‌بعدی جهان بازی"></div>
          <div class="scene-hint">برای چرخاندن جهان، لمس کن و بکش</div>
        </section>
        <footer class="bottom-panel">
          <div><small>طلا</small><strong>۱٬۲۰۰</strong></div>
          <div><small>چوب</small><strong>۸۵۰</strong></div>
          <div><small>سنگ</small><strong>۶۴۰</strong></div>
          <div><small>غذا</small><strong>۱٬۰۰۰</strong></div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
